# ==========================================================
# Archivo: dovecot.conf
# Unificación de /etc/dovecot/dovecot.conf y conf.d/
# ==========================================================

# Protocolos habilitados
protocols = imap pop3 lmtp

# Ubicación y formato de los buzones
mail_location = maildir:~/Maildir

# Configuración de autenticación
disable_plaintext_auth = no
auth_mechanisms = plain login

# Permisos de acceso al buzón
mail_privileged_group = mail

# Configuración de sockets y servicios
service imap-login {
  inet_listener imap {
    port = 143
  }
}

service pop3-login {
  inet_listener pop3 {
    port = 110
  }
}

service auth {
  unix_listener /var/spool/postfix/private/auth {
    mode = 0666
    user = postfix
    group = postfix
  }
}